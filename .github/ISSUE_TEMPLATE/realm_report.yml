name: Realm report
description: Send the realm names !RealmFix knows, from any region, so they can be built in for everyone.
title: "Realm report: "
labels: ["realm-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Reports from **every region** are welcome.
        In the game, type `/realmfix report`, press Ctrl+C, and paste it below.
        The report contains realm names and server numbers only: no character names, no GUIDs.
  - type: textarea
    id: report
    attributes:
      label: /realmfix report
      description: Paste the whole report here.
      render: text
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region (the one you picked in the Battle.net launcher)
      options:
        - Americas & Oceania
        - Europe
        - Korea
        - Taiwan
        - China
        - Not sure
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country you play from (optional)
      description: Helps us understand players who are placed on another region's layers, for example Oceanic players on US layers.
  - type: dropdown
    id: layers
    attributes:
      label: Are you ever placed on layers or shards outside your home area?
      options:
        - "No"
        - "Yes"
        - Not sure
  - type: textarea
    id: rulesets
    attributes:
      label: Rulesets
      description: For each realm in your report whose name doesn't say it, which ruleset is it (Normal/PvE, PvP, RP, RP-PvP, Hardcore)?
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
